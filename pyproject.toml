[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-platform"
version = "0.6.0"
description = "Agentic SOC Analyst Platform, Phase 6 observability"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "fakeredis>=2.26",
    "httpx>=0.27",
]

[project.scripts]
soc-ingest = "soc_platform.cli:main"
soc-outbox-relay = "soc_platform.outbox.relay:main"

[tool.setuptools.packages.find]
include = ["soc_platform*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires the Phase 1 PostgreSQL database",
]
